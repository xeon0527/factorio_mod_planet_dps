[tips-and-tricks-item-description]
dps-tat_briefing=A barren planet that appears to have an environment similar to Nauvis. At first glance, there's nothing particularly unusual about it besides the complete absence of life. However, an enormous number of unidentified machines have been detected across its surface...\n\nThe terrain is extremely rugged, so bringing some [item=cliff-explosives] will make your expedition much easier.
dps-tat_dps-scrap=[item=dps-resource_dps-scrap] is all that remains of the terraforming facilities that once stood here. While it's a great help when you're just getting started on the planet, the supply is far from sufficient. If you want to consume resources on an industrial scale, you'll need to find another way...
dps-tat_dps-subcore=Dealing damage to a DPS Subcore by any means will generate [item=dps-item_dps-credit_n] inside it. These items can be extracted using inserters.\n\nThe DPS Subcore uses internal inventory filters, so item generation will never be blocked by a lack of inventory space.
dps-tat_dorax=This giant that fell from the sky seems to possess durability far beyond anything our technology can comprehend. To study it, we'll have to take it apart somehow first... But how are we supposed to research something like this?
dps-tat_dorax-analysis=I first examined the machine's exterior. According to the nameplate attached to it, the machine's official designation appears to be D.O.R.A.X., an acronym for "DPS Operations and Resource Administration eXecutive." It also appears to be the property of a company called "VVube." DPS...? I have no idea what DPS is. Is it someone's name?\n\nIf the information on the nameplate is correct, then as far as I know, D.O.R.A.X. should be a highly sophisticated planetary management AI. Yet, somehow, although the machine is clearly still operational, I cannot find any sign of intelligent behavior. Most of the functions also fail to work when I try to use the control console, so there must be some kind of catastrophic failure inside.\n\nChecking the data logs revealed something strange. Starting on a certain date, D.O.R.A.X. suddenly lost its sanity and caused every living creature on the planet to... provoke? Anyway, it somehow made them attack itself. Why would it do something like that? After a long time had passed and all the creatures eventually died from exhaustion, it apparently went into orbit and spent a very long time searching for any surviving life, until eventually it fell down here to me.\n\nSo, in the end, the reason it came here was because it wanted someone to attack it... But what exactly is it planning? I have absolutely no idea what D.O.R.A.X. is capable of. I'm starting to get curious about this thing.\n\nIf it won't give me any information, I'll have to force it out of itself. D.O.R.A.X. is an incredibly sturdy machine. Ordinary firepower barely even leaves a scratch on it. Somehow, I'll tear D.O.R.A.X. apart!