[technology-description]
dps-tech_planet-discovery-dps=A desolate planet that appears to have an environment similar to Nauvis. The planet itself does not seem particularly remarkable, but an enormous number of unidentified machines have been detected on its surface...

dps-tech_dps-scrap-recycling=Recycle DPS Scrap into useful resources.\n\nDon't worry. Fulgora and the DPS planet are definitely different. Probably.
dps-tech_dps-credit-translator=DPS Credits are a unified currency representing every resource, piece of knowledge, and unit of energy obtained by attacking DPS Subcores. The DPS Credit Translator converts DPS Credits into useful resources.\n\nThe world is already overflowing with more information than we can handle. I like to keep things simple!
dps-tech_dps-credit-translator-trigger=Attack a [entity=dps-building_dps-subcore].
dps-tech_dps-credit-exchange=Compress large amounts of DPS Credits into higher denominations for easier storage and organization. Finance is unbelievably complicated. I recently bought some stocks and lost a fortune. I feel like crying.
dps-tech_dps-credit-exchange-trigger=Deal more than 1,000 damage per second to a single [entity=dps-building_dps-subcore].
dps-tech_dps-data-pack=To survive on this planet, where nothing but violence remains, you'll need even greater violence.
dps-tech_dps-data-pack-trigger=Deal more than 5,000 damage per second to a single [entity=dps-building_dps-subcore].

dps-tech_basic-dps-engineering=Gain a basic understanding of DPS to increase all types of damage by 100%. What exactly are we understanding about DPS? I'd rather not answer that.
dps-tech_cheap-magazine=Allows magazines to be produced from a wider variety of resources. They might even prove useful for something else...

dps-tech_discovery-of-dorax=It seems that something is sending a signal from orbit around the planet. The fact that there is clearly no life on a planet that was undergoing terraforming suggests that there may have been outside interference, so perhaps the two are related. Is there any way to lure it down and make it "land"?
dps-tech_dorax-analysis=D.O.R.A.X is clearly marked on the surface, likely indicating the machine's name. A closer examination may reveal some important information.

dps-tech_discovery-of-dorax-trigger=Find the entity responsible for turning this planet into a land of death.
dps-tech_supersonic-grenade-launcher=A lightweight turret that fires grenades at supersonic speeds, dealing heavy impact and explosive damage.

dps-tech_apfsds-cannon=You won't figure out how to take down D.O.R.A.X by overthinking it. Just build a fucking huge cannon and blast the living hell out of it. It'll probably work somehow.

dps-tech_dps-equipment-enhancer=DPS equipment on the planet can be enhanced. Our only goal is to hone our skills and achieve higher DPS. Let's make D.O.R.A.X. hurt even more.
dps-tech_apfsds-shell-enhancement-chance=Increases the enhancement chance of APFSDS shells by 1 percentage point per level. This is applied by adding a corresponding amount of productivity to the recipe.
dps-tech_apfsds-shell-productivity=Improves the productivity of APFSDS shells by 10 percentage points per level.
dps-tech_apfsds-shell-gun-speed=Improves the firing speed of APFSDS shells by 10 percentage points per level.
dps-tech_apfsds-shell-damage=Increases the damage of APFSDS shells by 10 percentage points per level.

dps-tech_advanced-dps-engineering=The knowledge gained from studying D.O.R.A.X greatly increases the damage of all weapon systems.
dps-tech_armory=A facility for efficiently producing the various items needed to support your weapon systems. After all, logistics win wars. Soldiers can't fight without food and ammunition, and turrets can't fight without oil and ammo.

dps-tech_apfsds-machine-gun=The original APFSDS cannon has been downsized and fitted with a longer barrel, greatly increasing its rate of fire. Better yet, it can now be enhanced to gain even more damage. But is it really good news that even turrets have joined the enhancement grind?
dps-tech_advanced-apfsds-shell=Unlocks additional enhancement levels for APFSDS shells. The cost is considerable, but surely the rewards will be worth it.
dps-tech_advanced-apfsds-shell-damage=Increases the damage of APFSDS shells by 20 percentage points per level.
dps-tech_advanced-apfsds-shell-enhancement-chance=Increases the enhancement chance of APFSDS shells from Lv. 6 to Lv. 10 by 1 percentage point per level. The probability effect is applied using a productivity bonus.
dps-tech_advanced-apfsds-shell-enhancement-chance_effects=Lv. 6–Lv. 10 APFSDS Shell Enhancement Chance +1%p
dps-tech_advanced-apfsds-shell-destruction-protection=Adds 5 percentage points per level to the chance of preserving an item when enhancement fails. Protected items are automatically put back into the enhancement process. The probability effect is applied using a productivity bonus.
dps-tech_advanced-apfsds-shell-destruction-protection_effects=Lv. 6–Lv. 10 APFSDS Shell Enhancement Failure Protection Chance +5%p
dps-tech_apfsds-machine-gun-enhancement-chance=Increases the enhancement chance of the APFSDS machine gun by 1 percentage point per level. The probability effect is applied using a productivity bonus.
dps-tech_apfsds-machine-gun-enhancement-chance_effects=APFSDS Machine Gun Enhancement Chance +1%p
dps-tech_apfsds-machine-gun-destruction-protection=Adds 5 percentage points per level to the chance of preserving an item when enhancement fails. Protected items are automatically put back into the enhancement process. The probability effect is applied using a productivity bonus.
dps-tech_apfsds-machine-gun-destruction-protection_effects=APFSDS Machine Gun Enhancement Failure Protection Chance +5%p

dps-tech_status-system=Don't you want to become stronger by leveling up, just like in an RPG? Even the dust generated by attacking D.O.R.A.X. can become experience that makes you stronger if you carefully collect and analyze every bit of it. Become stronger without limits.
dps-tech_status-system_effects=Unlocks the Status System.

dps-tech_dps-data-pack2=They say the best way to understand what DPS is is to wield the weapons yourself. But strangely enough, most DPS Masters seem to have siblings. I wonder why?
dps-tech_dps-data-pack2_trigger=Deal more than 1,000 damage per second to D.O.R.A.X.

dps-tech_dps-data-pack3=After a long and arduous research process, we have finally uncovered the ultimate principle behind DPS. It turns out that the harder you hit, the more it hurts.
dps-tech_dps-data-pack3_trigger=Deal more than 1,000,000 damage per second to D.O.R.A.X.