[tips-and-tricks-item-description]
dps-tat_briefing=나우비스와 유사한 환경을 갖춘 것으로 보이는 황량한 행성입니다. 행성 자체는 생명체가 없다는 것 외에는 특별한 점이 없어보입니다만 표면에서 정체를 알 수 없는 막대한 수의 기계가 탐지됩니다...\n\n지표면의 지형이 매우 험준하므로 [item=cliff-explosives]을 챙기면 큰 도움이 될 것입니다.
dps-tat_dps-scrap=[item=dps-resource_dps-scrap]은 과거 이곳에 있었던 테라포밍 시설들의 흔적입니다. 행성 개척 시작에 큰 도움을 주지만 양이 충분하지 않습니다. 본격적으로 대량의 자원을 사용하기 위해서는 다른 방법을 찾아야 할 것 같습니다...
dps-tat_dps-subcore=DPS 서브코어에게 어떤 수단으로든 데미지를 가하면 내부에 [item=dps-item_dps-credit_n]이 생성됩니다. 이 아이템은 투입기를 사용하여 꺼낼 수 있습니다.\nDPS 서브코어는 내부적으로 인벤토리 필터를 사용하므로 인벤토리 크기 부족으로 아이템 생성이 막히지 않습니다.
dps-tat_dorax=하늘에서 난데없이 떨어진 이 거인은 우리의 기술로 이해할 수 없는 수준의 내구력을 가지고 있는 것 같습니다. 일단 연구를 하려면 어떤 식으로든 분해를 해봐야 하는데 말이죠... 어떻게 해야 이 녀석을 연구할 수 있을까요?
dps-tat_dorax-analysis=기계의 표면을 먼저 살펴보았다. 표면에 붙어있는 명판에 따르면 이 기계의 정식 명칭은 D.O.R.A.X이며, DPS 운영 및 자원 관리 집행체(DPS Operations and Resource Administration eXecutive)의 줄임말인 것으로 보인다. 그리고 "VVube"라는 기업의 소유물인 것 같다. DPS...? DPS가 무엇인지는 모르겠다. 사람 이름인가?\n\n명판의 내용이 맞다면 내가 알기로는 D.O.R.A.X는 매우 고성능의 행성 관리 AI일 것이다. 하지만 어찌된 영문인지 이 기계는 분명히 작동중인 상태지만 어떠한 지적 능력도 찾아볼 수가 없다. 제어 콘솔을 사용해보려고 해도 대부분의 기능이 작동하지 않는 것을 보면 내부에 무언가 치명적인 고장이 있는 것 같다.\n\n데이터 로그를 확인해보니 이상한 사실이 드러났다. D.O.R.A.X는 특정 날짜부터 갑작스럽게 이성을 잃고 행성의 모든 생명체를... 도발? 아무튼 자기 자신을 공격하게 만들었다. 무슨 이유로 이런 행동을 한걸까? 한참 시간이 지나 모든 생명체가 지쳐서 죽어버린 뒤에는 궤도로 올라가서 아주 오랫동안 남아있는 생명체를 찾다가 나에게 떨어진 것 같다.\n\n결국 이 곳에 떨어진 이유는 자기 자신을 공격해달라는 것인데... 대체 무슨 속셈인거지? 나는 D.O.R.A.X가 어떤 능력을 갖고 있는지 전혀 모른다. 녀석에 대해 호기심이 생기기 시작했다.\n\n정보를 내놓지 않는다면 무력으로 꺼내는 수 밖에 없겠지. D.O.R.A.X는 아주 튼튼한 기계다. 어지간한 화력에는 흠집도 거의 나지 않는다. 어떻게든 D.O.R.A.X를 분해하고 말겠어!